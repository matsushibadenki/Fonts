[workspace]
members = ["crates/lumapaint-core", "crates/font-core", "crates/font-renderer", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }

[profile.dev.package.wgpu-core]
opt-level = 2

[patch.crates-io]
freetype-sys = { path = "vendor/freetype-sys" }
