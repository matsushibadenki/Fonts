[package]
name = "fonts-app"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde.workspace = true
serde_json = "1"
font-core = { path = "../crates/font-core" }
font-renderer = { path = "../crates/font-renderer" }
rfd = "=0.17.2"
ttf-parser = "=0.25.1"
dirs = "=7.0.0"
sha2 = "=0.11.1"
png = "=0.18.1"
unicode-normalization = "=0.1.26"
encoding_rs = "=0.8.42"
pollster = "=1.0.1"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "=0.56.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6.2"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSView", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSGeometry", "NSObject"] }
