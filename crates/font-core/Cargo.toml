[package]
name = "font-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json = { version = "1", features = ["float_roundtrip"] }
lumapaint-core = { path = "../lumapaint-core" }

ttf-parser = "=0.25.1"

freetype-rs = { version = "=0.38.0", features = ["bundled"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
base64 = "=0.23.1"
sha2 = "=0.11.1"
svgtypes = "=0.16.2"
roxmltree = "=0.21.2"
lopdf = { version = "=0.47.0", default-features = false }

brotli = "=9.1.1"

font-hinting-native = { path = "../font-hinting-native" }
resvg = { version = "=0.49.0", default-features = false, features = ["raster-images"] }
flate2 = "=1.1.11"

i_overlay = "=9.1.0"

uuid = { version = "=1.29.1", features = ["v4", "serde"] }

unicode-bidi = "=0.3.18"
